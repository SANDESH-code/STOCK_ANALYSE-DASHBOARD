services:
  # Backend API Service
  - type: web
    name: stock-analyse-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        fromDatabase:
          name: stock-analyse-db
          property: host
      - key: DB_PORT
        value: 3306
      - key: DB_USER
        fromDatabase:
          name: stock-analyse-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: stock-analyse-db
          property: password
      - key: DB_NAME
        value: stock_analyse_db
      - key: DB_POOL_SIZE
        value: 10
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_REFRESH_EXPIRE
        value: 30d
      - key: CORS_ORIGIN
        sync: false
      - key: UPLOAD_PATH
        value: ./uploads
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: ADMIN_EMAIL
        value: admin@stockanalyse.com
      - key: ADMIN_PASSWORD
        value: admin123
    healthCheckPath: /api/health

  # Frontend Static Site
  - type: web
    name: stock-analyse-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block

databases:
  - name: stock-analyse-db
    databaseName: stock_analyse_db
    plan: free
    region: oregon